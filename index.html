<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tahaddi Quiz de classe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
/* Plan : atelier de quiz pour la classe. Encre sarcelle profonde, un seul accent safran,
   réponses repérées par lettre + couleur (lisibles au vidéoprojecteur). Bibliothèque en grille, jeu plein écran. */
:root{
  --bg:#eef2ef; --surface:#ffffff; --ink:#12292b; --muted:#566b6c; --line:#d3dcd8;
  --brand:#0f5257; --accent:#e0a100; --on-accent:#12292b;
  --a:#0f6b70; --b:#b9860a; --c:#7a3b8f; --d:#c94f35; --good:#1d7f5a; --bad:#b3372b;
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1b1c; --surface:#152728; --ink:#e8efec; --muted:#9ab0ad; --line:#2a4042;
  --brand:#63c5c2; --accent:#f0b429; --on-accent:#12292b;
  --a:#16868b; --b:#b9860a; --c:#93509f; --d:#d2603f; --good:#3fb489; --bad:#e2675a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1b1c; --surface:#152728; --ink:#e8efec; --muted:#9ab0ad; --line:#2a4042;
  --brand:#63c5c2; --accent:#f0b429; --on-accent:#12292b;
  --a:#16868b; --b:#b9860a; --c:#93509f; --d:#d2603f; --good:#3fb489; --bad:#e2675a; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.1;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 56px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.logo{font:800 30px/1 var(--f-display);letter-spacing:-.02em;color:var(--brand);background:none;border:0;padding:0}
.logo i{font-style:normal;color:var(--accent)}
.tag{color:var(--muted);font-size:15px}
.sp{flex:1}
.btn{border:2px solid var(--ink);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:700}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--bg)}
.btn.sm{padding:5px 10px;font-size:14px;border-width:1.5px}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:stretch;margin-bottom:28px}
.hero .lead{background:var(--brand);color:var(--bg);border-radius:18px;padding:28px}
.hero h1{font-size:clamp(30px,5vw,50px);margin-bottom:10px}
.hero p{margin:0 0 18px;max-width:46ch}
.hero .lead .btn{border-color:transparent}
.modes{display:grid;gap:12px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.mode h3{font-size:19px;margin-bottom:4px}
.mode p{margin:0;color:var(--muted);font-size:15px}
.sec{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.sec h2{font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;border-top:6px solid var(--brand)}
.card.ex{border-top-color:var(--accent)}
.card h3{font-size:19px;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.pill{border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--muted)}
.pill.ex{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{border:2px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:18px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
input[type=text],select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:9px 11px}
textarea{resize:vertical;min-height:70px}
.ed{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.qlist{display:flex;flex-direction:column;gap:6px}
.qitem{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem.on{border-color:var(--brand);box-shadow:inset 4px 0 0 var(--brand)}
.qitem b{font-family:var(--f-display)}
.fields{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.optrow{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center}
.let{font:800 18px/1 var(--f-display);width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.c0 .let,.let.c0{background:var(--a)}.c1 .let,.let.c1{background:var(--b)}.c2 .let,.let.c2{background:var(--c)}.c3 .let,.let.c3{background:var(--d)}
.okpick{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;margin:0;white-space:nowrap}
.thumb{max-width:180px;max-height:110px;border-radius:8px;border:1px solid var(--line);display:block}
.err{color:var(--bad);font-weight:700}
.note{color:var(--muted);font-size:14px}
/* jeu */
.stage{min-height:100%;display:flex;flex-direction:column;padding:16px;gap:14px;max-width:1280px;margin:0 auto}
.gbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gbar .ttl{font:800 18px var(--f-display);color:var(--brand)}
.timer{font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 14px;min-width:74px;text-align:center}
.timer.low{background:var(--bad);color:#fff}
.gmain{display:grid;grid-template-columns:1fr 250px;gap:16px;flex:1;align-items:start}
.gmain.solo{grid-template-columns:1fr}
.qtext{font:800 clamp(24px,3.6vw,44px)/1.15 var(--f-display);text-wrap:balance;margin-bottom:14px;overflow-wrap:anywhere}
.qimg{max-width:100%;max-height:34vh;border-radius:12px;display:block;margin:0 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:clamp(17px,2vw,24px);font-weight:700;min-height:68px;overflow-wrap:anywhere}
.opt.c0{border-left:10px solid var(--a)}.opt.c1{border-left:10px solid var(--b)}.opt.c2{border-left:10px solid var(--c)}.opt.c3{border-left:10px solid var(--d)}
.opt .otxt{flex:1}
.opt.good{background:var(--good);border-color:var(--good);color:#fff}
.opt.good::after{content:"✓";font-size:1.3em}
.opt.dim{opacity:.4}
.cnt{font:800 20px var(--f-display);background:var(--ink);color:var(--bg);border-radius:8px;padding:2px 10px;font-variant-numeric:tabular-nums}
.board{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.board h3{font-size:16px;margin-bottom:8px;color:var(--muted)}
.sline{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-weight:700}
.sline:last-child{border:0}
.sline span:last-child{font-variant-numeric:tabular-nums;font-family:var(--f-display)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:700}
.chip.on{background:var(--good);border-color:var(--good);color:#fff}
.gfoot{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:26px 0;min-height:260px}
.step{flex:1;max-width:220px;text-align:center}
.step .nm{font:800 20px var(--f-display);overflow-wrap:anywhere}
.step .pts{color:var(--muted);font-variant-numeric:tabular-nums}
.step .bar{border-radius:12px 12px 0 0;margin-top:8px;display:grid;place-items:center;font:800 44px var(--f-display);color:var(--on-accent)}
.step.r1 .bar{height:170px;background:var(--accent)}
.step.r2 .bar{height:120px;background:var(--brand);color:var(--bg)}
.step.r3 .bar{height:84px;background:var(--c);color:#fff}
.code{font:800 clamp(48px,10vw,110px)/1 var(--f-display);letter-spacing:.06em;color:var(--brand);font-variant-numeric:tabular-nums}
.url{font-family:ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;overflow-wrap:anywhere;display:inline-block}
.lobby{display:flex;gap:32px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px}
.qr{background:#fff;padding:12px;border-radius:14px;border:1px solid var(--line);width:246px;min-height:246px}
.qr img,.qr canvas{display:block;width:220px;height:220px}
.players{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.players span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-weight:700}
/* joueur */
.phone{max-width:480px;margin:0 auto;padding:20px 16px;min-height:100%;display:flex;flex-direction:column;gap:16px}
.pbtns{display:grid;gap:12px;flex:1}
.pbtn{border:0;border-radius:16px;color:#fff;font-weight:700;font-size:20px;padding:18px;display:flex;align-items:center;gap:14px;text-align:left;min-height:76px}
.pbtn .let{background:rgba(255,255,255,.22)}
.pbtn.c0{background:var(--a)}.pbtn.c1{background:var(--b)}.pbtn.c2{background:var(--c)}.pbtn.c3{background:var(--d)}
.big{font:800 34px/1.1 var(--f-display);text-align:center;margin-top:30px}
.center{text-align:center}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;max-width:90vw;z-index:9}
@media (max-width:800px){.hero,.ed,.gmain,.two{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.btn{transition:background .15s,opacity .15s}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script>
"use strict";
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'q'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const LET=['A','B','C','D'];
const LEVELS=['Tronc commun','1ère année Bac','2ème année Bac','FLE A1','FLE A2','FLE B1','FLE B2','FLE C1','FOS','Autre'];
const DURS=[10,20,30,45,60,90];
const IN_ARTIFACT=!!window.claude||/claude/i.test(location.hostname);
const PEER_PREFIX='tahaddi-classe-';
const PEER_SRC='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
const QR_SRC='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';

const EXAMPLE={id:'exemple-boite',example:true,title:'La Boîte à merveilles : repères essentiels',level:'1ère année Bac',questions:[
 {id:'e1',type:'qcm',text:'Qui est l’auteur de « La Boîte à merveilles » ?',opts:['Driss Chraïbi','Ahmed Sefrioui','Tahar Ben Jelloun','Mohammed Khaïr-Eddine'],ok:1,dur:20,img:''},
 {id:'e2',type:'qcm',text:'En quelle année le roman est-il publié ?',opts:['1945','1962','1954','1970'],ok:2,dur:20,img:''},
 {id:'e3',type:'qcm',text:'Dans quelle ville se déroule l’histoire ?',opts:['Fès','Marrakech','Meknès','Rabat'],ok:0,dur:20,img:''},
 {id:'e4',type:'qcm',text:'Comment s’appelle le narrateur ?',opts:['Driss','Allal','Hammoussa','Sidi Mohammed'],ok:3,dur:20,img:''},
 {id:'e5',type:'vf',text:'Le père du narrateur, Maâlem Abdeslam, est tisserand.',opts:['Vrai','Faux','',''],ok:0,dur:15,img:''},
 {id:'e6',type:'qcm',text:'Comment appelle-t-on la maison où vit la famille du narrateur ?',opts:['Dar Sbitar','Dar Chouafa','Dar El Makhzen','Riad Zitoun'],ok:1,dur:20,img:''},
 {id:'e7',type:'qcm',text:'À quel genre appartient cette œuvre ?',opts:['Tragédie','Conte philosophique','Roman autobiographique','Nouvelle fantastique'],ok:2,dur:20,img:''}
]};

const S={view:'home',quizzes:[],sync:'local',edit:null,eq:0,errs:[],setup:null,backup:false};
let G=null,H=null,P=null,tick=null;

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)}
const clone=o=>JSON.parse(JSON.stringify(o));
const visOpts=q=>q.type==='vf'?[{t:'Vrai',i:0},{t:'Faux',i:1}]:q.opts.map((t,i)=>({t,i})).filter(o=>String(o.t).trim());
function cleanQuiz(q){ // assainit un quiz importé
  if(!q||typeof q!=='object'||!Array.isArray(q.questions))return null;
  return {id:/^[\w.-]{1,60}$/.test(q.id||'')&&q.id!==EXAMPLE.id?q.id:uid(),title:String(q.title||'Sans titre').slice(0,120),level:LEVELS.includes(q.level)?q.level:'Autre',updated:+q.updated||Date.now(),
   questions:q.questions.slice(0,200).map(x=>({id:uid(),type:x.type==='vf'?'vf':'qcm',text:String(x.text||'').slice(0,400),
     opts:[0,1,2,3].map(i=>String((x.opts||[])[i]||'').slice(0,160)),ok:[0,1,2,3].includes(+x.ok)?+x.ok:0,dur:DURS.includes(+x.dur)?+x.dur:20,
     img:typeof x.img==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(x.img)?x.img:''}))};
}

/* ---------- enregistrement ---------- */
const LS='tahaddi.quizzes.v1';
const store={col:null,
  local(){try{localStorage.setItem(LS,JSON.stringify(S.quizzes))}catch(e){}},
  async init(){
    try{S.quizzes=(JSON.parse(localStorage.getItem(LS)||'[]')||[]).map(cleanKeep).filter(Boolean)}catch(e){S.quizzes=[]}
    render();
    if(!window.claude||!window.claude.use)return;
    try{
      const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      const id=user&&await user.id(); if(!db||!id)return;
      const col=db.collection('data/users/'+id);
      const snap=await Promise.race([col.get(),new Promise((_,r)=>setTimeout(()=>r(new Error('délai')),10000))]);
      const remote=snap.docs.map(d=>cleanKeep(clone(d.data()))).filter(Boolean);
      this.col=col;S.sync='cloud';
      if(remote.length){S.quizzes=remote.sort((a,b)=>b.updated-a.updated);this.local()}
      else for(const q of S.quizzes)await col.doc(q.id).set(clone(q)).catch(()=>{});
      if(S.view==='home')render();
    }catch(e){}
  },
  async save(q){q.updated=Date.now();const i=S.quizzes.findIndex(x=>x.id===q.id);if(i<0)S.quizzes.unshift(q);else S.quizzes[i]=q;this.local();
    if(this.col){try{await this.col.doc(q.id).set(clone(q))}catch(e){toast(e&&e.code==='invalid_argument'?'Quiz trop lourd pour la sauvegarde en ligne : retirez ou réduisez des images.':'Sauvegarde en ligne impossible pour le moment. Le quiz reste dans ce navigateur.')}}},
  async del(id){S.quizzes=S.quizzes.filter(q=>q.id!==id);this.local();if(this.col)this.col.doc(id).delete().catch(()=>{})}
};
function cleanKeep(q){const c=cleanQuiz(q);if(c&&q.id&&/^[\w.-]{1,60}$/.test(q.id))c.id=q.id;if(c)c.questions.forEach((x,i)=>{const o=q.questions[i];if(o&&o.id)x.id=String(o.id).slice(0,40)});return c}

/* ---------- vues ---------- */
function render(){
  clearInterval(tick);
  const v={home:vHome,edit:vEdit,setup:vSetup,game:vGame,host:vHost,join:vJoin}[S.view]||vHome;
  app.innerHTML=v();
  if(S.view==='game'&&G.phase==='q')runTimer(G,()=>{G.phase='reveal';render()});
  if(S.view==='host'&&H&&H.phase==='q')runTimer(H,hostReveal);
  if(S.view==='host'&&H&&H.phase==='lobby')drawQR();
}
function head(extra=''){return `<div class="top"><button class="logo" data-act="home" aria-label="Accueil Tahaddi">Tahaddi<i>.</i></button><span class="tag">le défi en classe</span><span class="sp"></span>${extra}</div>`}
function card(q){const n=q.questions.length;return `<article class="card ${q.example?'ex':''}"><div class="meta">${q.example?'<span class="pill ex">Exemple</span>':''}<span class="pill">${esc(q.level)}</span><span class="pill">${n} question${n>1?'s':''}</span></div><h3>${esc(q.title)}</h3><span class="sp"></span><div class="row"><button class="btn pri sm" data-act="play" data-id="${esc(q.id)}">Lancer</button>${q.example?`<button class="btn sm ghost" data-act="dup" data-id="${esc(q.id)}">Copier dans mes quiz</button>`:`<button class="btn sm ghost" data-act="edit" data-id="${esc(q.id)}">Modifier</button><button class="btn sm ghost" data-act="dup" data-id="${esc(q.id)}">Dupliquer</button><button class="btn sm danger" data-act="del" data-id="${esc(q.id)}">Supprimer</button>`}</div></article>`}
function vHome(){
  return `<div class="wrap">${head(`<button class="btn ghost" data-act="go-join">Rejoindre une partie</button><button class="btn pri" data-act="new">Créer un quiz</button>`)}
  <section class="hero"><div class="lead"><h1>Vos quiz, votre classe, sans limite.</h1><p>Créez autant de quiz que vous voulez, avec autant de questions et de joueurs que nécessaire. Aucun abonnement, aucun compte pour les élèves.</p><button class="btn pri" data-act="new">Créer un quiz</button></div>
  <div class="modes"><div class="mode"><h3>Écran unique</h3><p>Le quiz est projeté. Les équipes répondent à main levée ou avec des cartons A, B, C, D, et vous attribuez les points.</p></div><div class="mode"><h3>Sur téléphones</h3><p>Chaque élève rejoint la partie avec un code à 6 chiffres. Les points tiennent compte de la justesse et de la rapidité.</p></div></div></section>
  <div class="sec"><h2>Mes quiz</h2><span class="note">${S.sync==='cloud'?'Enregistrés dans votre compte':'Enregistrés dans ce navigateur'}</span><span class="sp"></span><button class="btn sm ghost" data-act="backup">Sauvegarde et import</button></div>
  ${S.backup?`<div class="panel" style="margin:0 0 14px"><label for="bk">Sauvegarde de vos quiz (texte à copier, ou à coller ici pour importer)</label><textarea id="bk" rows="5" spellcheck="false">${esc(JSON.stringify(S.quizzes))}</textarea><div class="row" style="margin-top:8px"><button class="btn sm" data-act="bk-copy">Copier</button><button class="btn sm brand" data-act="bk-import">Importer le texte collé</button><span class="note">Utile pour transférer vos quiz vers un autre appareil ou une autre adresse du site.</span></div></div>`:''}
  <div class="grid">${S.quizzes.map(card).join('')}${card(EXAMPLE)}</div>
  ${S.quizzes.length?'':'<p class="note" style="margin-top:12px">Vous n’avez pas encore de quiz. Lancez l’exemple pour essayer, ou créez le vôtre.</p>'}
  </div>`;
}
function newQ(){return {id:uid(),type:'qcm',text:'',opts:['','','',''],ok:0,dur:20,img:''}}
function vEdit(){
  const z=S.edit,q=z.questions[S.eq];
  return `<div class="wrap">${head(`<button class="btn ghost" data-act="home">Annuler</button><button class="btn pri" data-act="save">Enregistrer le quiz</button>`)}
  <div class="panel" style="margin:0 0 16px"><div class="two"><div><label for="f-title">Titre du quiz</label><input type="text" id="f-title" data-f="title" maxlength="120" value="${esc(z.title)}" placeholder="Ex. Antigone : le prologue"></div><div><label for="f-level">Niveau</label><select id="f-level" data-f="level">${LEVELS.map(l=>`<option ${l===z.level?'selected':''}>${l}</option>`).join('')}</select></div></div>
  ${S.errs.length?`<p class="err" role="alert" style="margin:12px 0 0">${S.errs.map(esc).join('<br>')}</p>`:''}</div>

function runTimer(st,onEnd){

function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}

function loadPeer(){return new Promise((ok,ko)=>{if(window.Peer)return ok();const s=document.createElement('script');s.src=PEER_SRC;s.onload=()=>window.Peer?ok():ko();s.onerror=ko;document.head.appendChild(s)})}
const online=()=>Object.values(H.players).filter(p=>p.conn&&p.conn.open);
function uniqueName(name){const taken=new Set(Object.values(H.players).map(p=>p.name.toLowerCase()));let n=name,k=2;while(taken.has(n.toLowerCase()))n=name.slice(0,17)+' '+k++;return n}
function sendTo(p,m){p.last=m;try{p.conn.open&&p.conn.send(m)}catch(e){}}
function ranking(){return Object.values(H.players).map(p=>({name:p.name,score:p.score})).sort((a,b)=>b.score-a.score)}
function bcast(m){for(const p of Object.values(H.players))try{p.conn.open&&p.conn.send(m)}catch(e){}}
async function hostOpen(quiz){
  H={quiz,code:'',players:{},keys:{},i:0,phase:'opening',left:0,err:''};S.view='host';render();keepAwake();
  try{await loadPeer()}catch(e){H.err='Impossible de charger le module de connexion. Vérifiez la connexion internet.';return render()}
  const tryOpen=()=>{const code=String(Math.floor(100000+Math.random()*900000));const peer=new Peer(PEER_PREFIX+code);H.peer=peer;
    peer.on('open',()=>{H.code=code;H.phase='lobby';render()});
    peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();tryOpen()}else if(H.phase==='opening'){H.err='Connexion au service de mise en relation impossible. Réessayez dans un instant.';render()}});
    peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
    peer.on('connection',conn=>{conn.on('data',m=>hostMsg(conn,m));conn.on('close',()=>{const k=H&&H.keys[conn.peer],p=k&&H.players[k];if(p&&p.conn===conn&&H.phase==='lobby'){delete H.players[k];render()}})});
  };tryOpen();
}
function hostMsg(conn,m){
  if(!H||!m||typeof m!=='object')return;
  if(m.t==='join'){ // un élève qui revient (téléphone en veille, page rechargée) retrouve ses points
    const key=typeof m.pid==='string'&&/^[a-z0-9]{8,40}$/.test(m.pid)?'p:'+m.pid:conn.peer;H.keys[conn.peer]=key;
    let p=H.players[key];
    if(p){if(p.conn&&p.conn!==conn)try{p.conn.close()}catch(e){}p.conn=conn}
    else{if(Object.keys(H.players).length>=300)return;p=H.players[key]={name:uniqueName(String(m.name||'').trim().slice(0,20)||'Joueur'),score:0,ans:null,at:0,conn}}
    conn.send({t:'lobby',title:H.quiz.title,name:p.name});
    if(H.phase==='lobby')render();else if(H.phase==='q'){if(p.ans===null)sendQ(conn);else conn.send({t:'wait'})}else if(p.last)conn.send(p.last);return}
  const p=H.players[H.keys[conn.peer]];if(!p||p.conn!==conn)return;
  if(m.t==='ans'&&H.phase==='q'&&m.q===H.i&&p.ans===null&&[0,1,2,3].includes(m.c)){p.ans=m.c;p.at=H.dur-Math.max(0,H.left);
    const on=online(),done=on.filter(x=>x.ans!==null).length;const el=$('#answered');if(el)el.textContent=done+' / '+on.length+' réponses';
    if(on.length&&done>=on.length){clearInterval(tick);hostReveal()}}
}
function sendQ(conn){const q=H.quiz.questions[H.i];const m={t:'q',i:H.i,n:H.quiz.questions.length,text:q.text,opts:visOpts(q)};conn?conn.send(m):bcast(m)}
function hostAsk(){const q=H.quiz.questions[H.i];H.phase='q';H.dur=q.dur;H.left=q.dur;for(const p of Object.values(H.players)){p.ans=null;p.at=0;p.gain=0}sendQ();render()}
function hostReveal(){
  const q=H.quiz.questions[H.i];H.phase='reveal';H.counts={};
  for(const p of Object.values(H.players)){if(p.ans!==null)H.counts[p.ans]=(H.counts[p.ans]||0)+1;const ok=p.ans===q.ok;p.gain=ok?Math.round(500+500*(1-Math.min(1,p.at/H.dur))):0;p.score+=p.gain}
  const r=ranking();
  for(const p of Object.values(H.players))sendTo(p,{t:'res',ok:p.ans===q.ok,answered:p.ans!==null,gain:p.gain,score:p.score,rank:r.findIndex(x=>x.name===p.name)+1,total:r.length,good:(visOpts(q).find(o=>o.i===q.ok)||{}).t||''});
  render();
}
function hostNext(){if(H.i>=H.quiz.questions.length-1){H.phase='end';const r=ranking();for(const p of Object.values(H.players))sendTo(p,{t:'end',score:p.score,rank:r.findIndex(x=>x.name===p.name)+1,total:r.length});render()}else{H.i++;hostAsk()}}
function hostClose(){if(H&&H.peer){try{H.peer.destroy()}catch(e){}}H=null}

  if(H.phase==='end')return `<div class="stage"><div class="gbar"><span class="ttl">${esc(z.title)}</span></div><h1 class="center" style="font-size:44px">Le podium</h1>${podium(ranking())}<div class="row" style="justify-content:center;margin-top:20px"><button class="btn" data-act="quit">Fermer la salle</button></div></div>`;

const PID=(()=>{try{let v=sessionStorage.getItem('tahaddi.pid');if(!/^[a-z0-9]{8,40}$/.test(v||'')){v=uid();sessionStorage.setItem('tahaddi.pid',v)}return v}catch(e){return ''}})();

  const fail=m=>{if(P&&(P.phase==='connecting')){P.phase='form';P.err=m;try{P.peer&&P.peer.destroy()}catch(e){}render()}};

  const peer=new Peer();P.peer=peer;
  const to=setTimeout(()=>fail('La salle ne répond pas. Vérifiez le code et réessayez.'),15000);
  peer.on('error',e=>fail(e.type==='peer-unavailable'?'Aucune partie avec ce code.':'Connexion impossible sur ce réseau. Réessayez.'));
  peer.on('open',()=>{const conn=peer.connect(PEER_PREFIX+P.code,{reliable:true});P.conn=conn;
    conn.on('open',()=>{conn.send({t:'join',name:P.name,pid:PID});keepAwake()});
    conn.on('data',m=>{if(!m||typeof m!=='object'||!P)return;
      if(m.t==='lobby'){clearTimeout(to);P.title=String(m.title||'');if(m.name)P.name=String(m.name).slice(0,24);if(P.phase==='connecting')P.phase='lobby'}
      else if(m.t==='wait')P.phase='wait'
      else if(m.t==='q'&&Array.isArray(m.opts)){P.q={i:+m.i||0,n:+m.n||0,text:String(m.text||''),opts:m.opts.filter(o=>o&&[0,1,2,3].includes(o.i)).map(o=>({i:o.i,t:String(o.t||'')}))};P.phase='q'}
      else if(m.t==='res'){P.res={ok:!!m.ok,answered:!!m.answered,gain:+m.gain||0,score:+m.score||0,rank:+m.rank||0,total:+m.total||0,good:String(m.good||'')};P.phase='res'}
      else if(m.t==='end'){P.res={score:+m.score||0,rank:+m.rank||0,total:+m.total||0};P.phase='end'}
      render()});
    conn.on('close',()=>{if(P&&P.phase!=='end'&&P.phase!=='form'){P.phase='lost';render()}});
  });
}
function playerLeave(){if(P&&P.peer){try{P.peer.destroy()}catch(e){}}P=null}

/* ---------- actions ---------- */
function go(v){S.view=v;render();window.scrollTo(0,0)}
function findQuiz(id){return id===EXAMPLE.id?EXAMPLE:S.quizzes.find(q=>q.id===id)}
let armed=null;
const A={
  home(){hostClose();playerLeave();G=null;S.edit=null;S.errs=[];try{if(location.hash)history.replaceState(null,'',location.pathname+location.search)}catch(e){}go('home')},
  'go-join'(){P=null;go('join')},
  new(){S.edit={id:uid(),title:'',level:LEVELS[0],questions:[newQ()]};S.eq=0;S.errs=[];go('edit')},
  edit(d){const q=findQuiz(d.id);if(!q)return;S.edit=clone(q);S.eq=0;S.errs=[];go('edit')},
  async dup(d){const q=findQuiz(d.id);if(!q)return;const c=clone(q);delete c.example;c.id=uid();c.title=q.example?q.title:q.title+' (copie)';c.questions.forEach(x=>x.id=uid());await store.save(c);toast('Quiz copié dans votre bibliothèque.');render()},
  del(d,el){if(armed!==d.id){armed=d.id;el.textContent='Confirmer la suppression';setTimeout(()=>{if(armed===d.id){armed=null;if(S.view==='home')render()}},4000);return}armed=null;store.del(d.id);render()},
  play(d){const q=findQuiz(d.id);if(!q)return;const e=validate(clone(q));if(e.length){toast('Ce quiz est incomplet : ouvrez-le pour le corriger.');return}S.setup={quiz:q,mode:'screen',teams:['Équipe 1','Équipe 2','Équipe 3','Équipe 4']};go('setup')},
  backup(){S.backup=!S.backup;render()},
  'bk-copy'(){const v=$('#bk').value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Sauvegarde copiée.'),()=>{$('#bk').select();toast('Sélectionné : copiez avec Ctrl+C.')})},
  async 'bk-import'(){let arr;try{arr=JSON.parse($('#bk').value)}catch(e){return toast('Texte illisible : collez une sauvegarde complète.')}
    if(!Array.isArray(arr))arr=[arr];let n=0;for(const raw of arr){const q=cleanQuiz(raw);if(!q)continue;if(S.quizzes.some(x=>x.id===q.id))q.id=uid();await store.save(q);n++}toast(n?n+' quiz importé(s).':'Aucun quiz trouvé dans ce texte.');render()},
  'q-sel'(d){S.eq=+d.i;render()},
  'q-add'(){S.edit.questions.push(newQ());S.eq=S.edit.questions.length-1;render();$('#f-text').focus()},
  'q-dup'(){const c=clone(S.edit.questions[S.eq]);c.id=uid();S.edit.questions.splice(S.eq+1,0,c);S.eq++;render()},
  'q-del'(){if(S.edit.questions.length<2)return;S.edit.questions.splice(S.eq,1);S.eq=Math.max(0,S.eq-1);render()},
  'q-up'(){const a=S.edit.questions,i=S.eq;if(i<1)return;[a[i-1],a[i]]=[a[i],a[i-1]];S.eq--;render()},
  'q-down'(){const a=S.edit.questions,i=S.eq;if(i>=a.length-1)return;[a[i+1],a[i]]=[a[i],a[i+1]];S.eq++;render()},
  'img-del'(){S.edit.questions[S.eq].img='';render()},
  async save(){S.errs=validate(S.edit);if(S.errs.length){render();window.scrollTo(0,0);return}await store.save(S.edit);S.edit=null;toast('Quiz enregistré.');go('home')},
  mode(d){S.setup.mode=d.m;render()},
  'start-screen'(){const s=S.setup;G={quiz:s.quiz,teams:s.teams.map((t,i)=>({name:t.trim()||('Équipe '+(i+1)),score:0})),i:0,phase:'q',left:s.quiz.questions[0].dur,won:new Set()};go('game')},
  'g-reveal'(){G.phase='reveal';render()},
  award(d){const i=+d.i;if(G.won.has(i)){G.won.delete(i);G.teams[i].score-=100}else{G.won.add(i);G.teams[i].score+=100}render()},
  'g-next'(){if(G.i>=G.quiz.questions.length-1)G.phase='end';else{G.i++;G.phase='q';G.left=G.quiz.questions[G.i].dur;G.won=new Set()}render()},
  replay(){G.teams.forEach(t=>t.score=0);G.i=0;G.phase='q';G.left=G.quiz.questions[0].dur;G.won=new Set();render()},
  full(){try{(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>toast('Plein écran indisponible ici.'))}catch(e){toast('Plein écran indisponible ici.')}},
  quit(d,el){if(armed!=='quit'){armed='quit';el.textContent='Confirmer';setTimeout(()=>{if(armed==='quit'){armed=null;render()}},4000);return}armed=null;A.home()},
  'start-host'(){hostOpen(S.setup.quiz)},
  'h-start'(){if(Object.keys(H.players).length){H.i=0;hostAsk()}},
  'h-reveal'(){clearInterval(tick);hostReveal()},
  'h-next'(){hostNext()},
  'p-join'(){playerJoin()},
  'p-ans'(d){if(P.phase!=='q')return;try{P.conn.send({t:'ans',q:P.q.i,c:+d.c})}catch(e){}P.phase='wait';render()},
  'p-reset'(){const c=P&&P.code||'',n=P&&P.name||'';playerLeave();P={phase:'form',err:'',name:n,code:c};render()},
  'p-leave'(){A.home()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f)f(el.dataset,el)});
function onField(e){
  const el=e.target,f=el.dataset&&el.dataset.f;if(!f)return;
  if(S.view==='setup'){const s=S.setup;
    if(f==='nteams'&&e.type==='change'){const n=+el.value;while(s.teams.length<n)s.teams.push('Équipe '+(s.teams.length+1));s.teams.length=n;render()}
    if(f==='team')s.teams[+el.dataset.i]=el.value;return}
  if(S.view!=='edit')return;const z=S.edit,q=z.questions[S.eq];
  if(f==='title')z.title=el.value;
  else if(f==='level')z.level=el.value;
  else if(f==='text'){q.text=el.value;const it=document.querySelector('.qitem.on');if(it)it.innerHTML='<b>'+(S.eq+1)+'.</b> '+esc(q.text||'Nouvelle question')}
  else if(f==='opt')q.opts[+el.dataset.i]=el.value;
  else if(f==='ok')q.ok=+el.value;
  else if(f==='dur')q.dur=+el.value;
  else if(f==='type'&&e.type==='change'){q.type=el.value;if(q.type==='vf'&&q.ok>1)q.ok=0;render()}
  else if(f==='img'&&e.type==='change'&&el.files[0])loadImg(el.files[0],q);
}
document.addEventListener('input',onField);document.addEventListener('change',onField);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&S.view==='join'&&P&&P.phase==='form'&&e.target.tagName==='INPUT'){e.preventDefault();playerJoin()}});
function loadImg(file,q){
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);q.img=c.toDataURL('image/jpeg',.7);render()};im.onerror=()=>toast('Image illisible. Essayez un fichier JPG ou PNG.');im.src=r.result};r.readAsDataURL(file);
}
function hashCode(){const m=/^#rejoindre-(\d{6})$/.exec(location.hash);return m?m[1]:''}
const isJoinHash=()=>/^#rejoindre(-\d{6})?$/.test(location.hash);
window.addEventListener('hashchange',()=>{if(isJoinHash()&&S.view==='home'){P=null;go('join')}});
window.addEventListener('beforeunload',()=>{hostClose();playerLeave()});
if(isJoinHash())S.view='join';
store.init();
</script>
